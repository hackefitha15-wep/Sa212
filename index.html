<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social OSINT Scanner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>🔍 Social OSINT Scanner</h1>
  <p class="subtitle">فحص اسم المستخدم عبر منصات التواصل الاجتماعي</p>

  <div class="search-box">
    <input id="user" placeholder="اسم المستخدم (بدون @)" autocomplete="off"
           onkeydown="if(event.key==='Enter')scan()">
    <button id="btn" onclick="scan()">فحص الآن</button>
  </div>

  <div class="stats" id="stats"></div>
  <div class="progress-bar" id="progressBar" style="display:none">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div id="results"></div>

  <footer>
    <p>أداة OSINT للفحص العام — كل النتائج من مصادر مفتوحة فقط</p>
    <p><a href="https://github.com/C3n7ral041s/WhatsMyName" target="_blank">
      للفحص الشامل 400+ منصة استخدم WhatsMyName</a></p>
  </footer>
</div>
<script src="script.js"></script>
</body>
</html>
